# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings (community parameter names on top of Mojmap)
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge versions
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.226
loader_version_range=[1,)

# Iron's Spells 'n Spellbooks — hard dependency
# Maven: https://code.redspace.io/releases
irons_spellbooks_version=1.21.1-3.15.6
irons_spellbooks_version_range=[1.21.1-3.15.6,1.21.2)

# GeckoLib — transitive dependency via Iron's Spellbooks, but we import its
# types directly (models, renderers, layers), so we declare it explicitly to
# expose them at compile time.
# Maven: https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/
geckolib_version=4.7.5.1

## Mod Properties
mod_id=college_of_winterhold
mod_name=College of Winterhold
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.payangar.collegeofwinterhold
mod_authors=Payangar
mod_description=A Minecraft recreation of the Skyrim College of Winterhold.
